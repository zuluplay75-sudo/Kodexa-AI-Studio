name: Kodexa Conector (Windows)

# Gera o KodexaConector.exe (Node SEA) e o pacote MSIX num Windows de verdade, e testa:
# - o .exe roda e se reconhece como executável único;
# - com o Codex instalado pelo npm, o conector encontra o Codex (launcher do pacote via node);
# - o MSIX, assinado só para o teste com um certificado descartável, instala e abre pelo alias.
# Artefatos: o .exe e o .msix SEM assinatura (para enviar à Microsoft Store, que assina).
on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Package/Identity/Name do Partner Center (opcional)'
        required: false
      publisher:
        description: 'Package/Identity/Publisher do Partner Center, ex.: CN=XXXXXXXX-... (opcional)'
        required: false
      publisher_display:
        description: 'Nome do editor na loja (opcional)'
        required: false
  push:
    branches: [feat/kodexa-public-studio]
    paths:
      - 'scripts/kodexa-connector*.ts'
      - 'scripts/build-connector-exe.mjs'
      - 'packaging/msix/**'
      - '.github/workflows/conector-windows.yml'

permissions:
  contents: read

concurrency:
  group: conector-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      IDENTITY_NAME: ${{ inputs.identity_name || 'Kodexa.Conector' }}
      PUBLISHER: ${{ inputs.publisher || 'CN=Kodexa' }}
      PUBLISHER_DISPLAY: ${{ inputs.publisher_display || 'Kodexa' }}
      VERSION: 1.0.${{ github.run_number }}.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Gerar KodexaConector.exe
        run: node scripts/build-connector-exe.mjs

      - name: Testar o .exe
        shell: pwsh
        run: |
          $out = & .\dist\connector\KodexaConector.exe --versao 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Kodexa Conector \d+\.\d+\.\d+ \(execut') { throw 'O .exe não se reconheceu como executável único.' }

      - name: Testar a busca do Codex instalado pelo npm
        shell: pwsh
        run: |
          npm install -g @openai/codex
          # Sem servidor de verdade: o conector acha o Codex e falha ao conectar (porta fechada), como esperado.
          $out = & .\dist\connector\KodexaConector.exe --servidor http://127.0.0.1:9 --codigo AAAA-BBBB 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Codex: encontrado') { throw 'O conector não encontrou o Codex instalado pelo npm.' }

      - name: Montar o MSIX (para a Store, sem assinatura)
        shell: pwsh
        run: pwsh packaging/msix/build.ps1 -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER -PublisherDisplayName $env:PUBLISHER_DISPLAY -Version $env:VERSION

      - name: Instalar o MSIX de teste e abrir pelo alias
        shell: pwsh
        run: |
          # Certificado descartável, só para instalar neste runner; o pacote da Store não usa este certificado.
          $subject = 'CN=Kodexa Teste'
          pwsh packaging/msix/build.ps1 -IdentityName $env:IDENTITY_NAME -Publisher $subject -PublisherDisplayName 'Kodexa Teste' -Version $env:VERSION -Output dist\msix\teste.msix
          $cert = New-SelfSignedCertificate -Type Custom -Subject $subject -KeyUsage DigitalSignature -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          Export-Certificate -Cert $cert -FilePath dist\msix\teste.cer | Out-Null
          Import-Certificate -FilePath dist\msix\teste.cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint dist\msix\teste.msix
          if ($LASTEXITCODE -ne 0) { throw 'Assinatura de teste falhou.' }
          Add-AppxPackage -Path dist\msix\teste.msix
          Get-AppxPackage -Name $env:IDENTITY_NAME | Format-List Name, Version, Publisher, InstallLocation
          $alias = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\kodexa-conector.exe'
          $out = & $alias --versao 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Kodexa Conector') { throw 'O app instalado não abriu pelo alias.' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kodexa-conector-windows
          path: |
            dist/connector/KodexaConector.exe
            dist/msix/KodexaConector.msix
          if-no-files-found: error
